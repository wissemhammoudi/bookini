apiVersion: 1

groups:
  - orgId: 1
    name: bookiwa7dek-sre
    folder: bookiwa7dek
    interval: 30s
    rules:
      - uid: backend-target-down
        title: BackendTargetDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(up{job="bookiwa7dek-backend"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
              conditions:
                - type: query
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          team: platform
        annotations:
          summary: Backend target is down
          description: Prometheus cannot scrape the backend target (job bookiwa7dek-backend) for more than 2 minutes.
        isPaused: false

      - uid: high-api-5xx-rate
        title: HighApi5xxErrorRate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 * sum((rate(bookini_http_requests_total{status_code=~"5.."}[5m])) or (rate(bookiwa7dek_http_requests_total{status_code=~"5.."}[5m]))) / (sum((rate(bookini_http_requests_total[5m])) or (rate(bookiwa7dek_http_requests_total[5m]))) + 0.001)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
              conditions:
                - type: query
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          team: backend
        annotations:
          summary: High API 5xx error rate
          description: API 5xx error rate is above 5% for 10 minutes.
        isPaused: false

      - uid: high-api-4xx-rate
        title: HighApi4xxErrorRate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 * sum((rate(bookini_http_requests_total{status_code=~"4.."}[5m])) or (rate(bookiwa7dek_http_requests_total{status_code=~"4.."}[5m]))) / (sum((rate(bookini_http_requests_total[5m])) or (rate(bookiwa7dek_http_requests_total[5m]))) + 0.001)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
              conditions:
                - type: query
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params:
                      - 25
                  operator:
                    type: and
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Elevated API 4xx error rate
          description: API 4xx error rate is above 25% for 15 minutes.
        isPaused: false

      - uid: node-high-cpu-usage
        title: NodeHighCpuUsage
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              type: threshold
              refId: B
              conditions:
                - type: query
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params:
                      - 85
                  operator:
                    type: and
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          team: platform
        annotations:
          summary: Node CPU usage is high
          description: CPU usage has been above 85% for 10 minutes on {{ $labels.instance }}.
        isPaused: false

groups:
  - name: availability.rules
    interval: 30s
    rules:
      - alert: BackendTargetDown
        expr: up{job="bookiwa7dek-backend"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: Backend target is down
          description: Prometheus cannot scrape the backend target (job bookiwa7dek-backend) for more than 2 minutes.

      - alert: MonitoringTargetDown
        expr: up{job=~"cadvisor|node-exporter|prometheus"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: Monitoring target is down
          description: A monitoring component (cadvisor, node-exporter, or Prometheus) has not been reachable for 5 minutes.

  - name: api-reliability.rules
    interval: 30s
    rules:
      - alert: HighApi5xxErrorRate
        expr: |
          (
            sum(rate({__name__=~"bookini_http_requests_total|bookiwa7dek_http_requests_total",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate({__name__=~"bookini_http_requests_total|bookiwa7dek_http_requests_total"}[5m])), 0.001)
          ) * 100 > 5
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: High API 5xx error rate
          description: API 5xx error rate is above 5% for 10 minutes.

      - alert: HighApi4xxErrorRate
        expr: |
          (
            sum(rate({__name__=~"bookini_http_requests_total|bookiwa7dek_http_requests_total",status_code=~"4.."}[5m]))
            /
            clamp_min(sum(rate({__name__=~"bookini_http_requests_total|bookiwa7dek_http_requests_total"}[5m])), 0.001)
          ) * 100 > 25
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Elevated API 4xx error rate
          description: API 4xx error rate is above 25% for 15 minutes.

      - alert: LowApiTraffic
        expr: sum(rate({__name__=~"bookini_http_requests_total|bookiwa7dek_http_requests_total"}[10m])) < 0.05
        for: 20m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: API traffic is unusually low
          description: Request throughput is below 0.05 requests/second for 20 minutes.

  - name: host-infra.rules
    interval: 30s
    rules:
      - alert: NodeHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: Node CPU usage is high
          description: CPU usage has been above 85% for 10 minutes on {{ $labels.instance }}.

      - alert: NodeHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: Node memory usage is high
          description: Memory usage has been above 90% for 10 minutes on {{ $labels.instance }}.

      - alert: NodeDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/sys.*|/proc.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/sys.*|/proc.*"}
          ) * 100 < 10
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: Node disk space is low
          description: Free disk space is below 10% on {{ $labels.instance }} mount {{ $labels.mountpoint }}.

      - alert: ContainerFrequentRestarts
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: Container restarted frequently
          description: Container {{ $labels.name }} restarted more than 2 times in 15 minutes.

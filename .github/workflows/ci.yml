name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: bookini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: python -m ruff check .

      - name: Run backend tests
        run: python -m pytest

      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/UI tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high

  admin-frontend-quality:
    name: Admin Frontend Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/UI tests
        run: npm run test

      - name: Build
        run: npm run build

  package-images:
    name: Build, Scan and Push Images
    needs: [backend-quality, frontend-quality, admin-frontend-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bookini-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bookini-frontend
      ADMIN_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bookini-admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ${{ env.ADMIN_FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.ADMIN_FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image (high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan frontend image (high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan admin frontend image (high/critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ADMIN_FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  deploy-staging:
    name: Deploy to Staging VPS
    needs: [package-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.SSH_TARGET_DIR }}"
            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export GRAFANA_ADMIN_USER="${{ secrets.GRAFANA_ADMIN_USER }}"
            export GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

            export BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-backend:${{ github.sha }}"
            export FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-frontend:${{ github.sha }}"
            export ADMIN_FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-admin-frontend:${{ github.sha }}"

            docker compose -f docker-compose.prod.yml pull backend frontend admin-frontend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Run staging smoke checks
        run: |
          bash .github/workflows/scripts/smoke-tests.sh \
            "${{ secrets.FRONTEND_URL }}" \
            "${{ secrets.ADMIN_FRONTEND_URL }}" \
            "${{ secrets.API_HEALTH_URL }}"

  deploy-production:
    name: Deploy to Production VPS
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.SSH_TARGET_DIR }}"
            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            export GRAFANA_ADMIN_USER="${{ secrets.GRAFANA_ADMIN_USER }}"
            export GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

            export BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-backend:${{ github.sha }}"
            export FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-frontend:${{ github.sha }}"
            export ADMIN_FRONTEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/bookini-admin-frontend:${{ github.sha }}"

            docker compose -f docker-compose.prod.yml pull backend frontend admin-frontend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Run production smoke checks
        run: |
          bash .github/workflows/scripts/smoke-tests.sh \
            "${{ secrets.FRONTEND_URL }}" \
            "${{ secrets.ADMIN_FRONTEND_URL }}" \
            "${{ secrets.API_HEALTH_URL }}"


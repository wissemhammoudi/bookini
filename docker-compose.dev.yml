services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookiwa7dek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookiwa7dek"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SECRET_KEY: dev-secret-key-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/bookiwa7dek
      REDIS_URL: redis://redis:6379/0
      SEED_DEFAULT_USERS: "true"
      SEED_USER_EMAIL: user@bookiwa7dek.com
      SEED_USER_PASSWORD: User123456!
      SEED_ADMIN_EMAIL: admin@bookiwa7dek.com
      SEED_ADMIN_PASSWORD: Admin123456!
      SEED_SUPER_ADMIN_EMAIL: superadmin@bookiwa7dek.com
      SEED_SUPER_ADMIN_PASSWORD: SuperAdmin123456!
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  admin-frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"]
    ports:
      - "5174:5174"
    volumes:
      - ./admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  admin_frontend_node_modules:
